# Open Brain — scheduled-services slice of the compose project.
#
# Included from docker-compose.yml via the `include:` directive. Holds
# every container whose job is to run on a schedule (currently: digest,
# gmail-pull, gmail-prune) plus the cron container that fires them via
# HTTP.
#
# Design notes:
#  - The cron container (openbrain-cron) holds the only source of truth
#    for when jobs fire (../docker/cron/crontab). No Windows Task
#    Scheduler entries needed.
#  - Each scheduled service is long-running and exposes POST /run on
#    port 8080 (obnet-internal only). Cron fires it via curl.
#  - No docker socket is mounted anywhere; cron talks to the services
#    over the internal network, which is the policy the rest of the
#    stack enforces.
#  - OAuth secrets are bind-mounted INDIVIDUALLY from
#    ../secrets/google/<dir>/ on top of in-repo 0-byte placeholder paths
#    (see the comment in each service below).

name: open-brain

services:
  # ── Cron engine ─────────────────────────────────────────────────────
  # supercronic + curl in a small alpine image. Reads ./cron/crontab and
  # curls each scheduled service's /run endpoint on cadence. No Docker
  # socket; nothing privileged. New scheduled jobs = one line in
  # crontab + a /run endpoint on the target service.
  openbrain-cron:
    build:
      context: ./cron
      dockerfile: Dockerfile
    image: openbrain-cron:local
    container_name: openbrain-cron
    restart: unless-stopped
    networks:
      - obnet
    # Bind-mount the crontab from host so schedules can be edited
    # without rebuilding the image. `docker compose restart openbrain-cron`
    # reloads. The Dockerfile COPYs a default copy for the no-bind case.
    volumes:
      - ./cron/crontab:/etc/openbrain-crontab:ro
    # supercronic forwards SIGTERM cleanly via tini in the Dockerfile.

  # ── Daily digest (HTTP-triggered) ───────────────────────────────────
  # Long-running Deno HTTP service. POST /run triggers the digest; cron
  # fires at 07:00 local. Calls the LLM gateway (weather brief,
  # synthesizer, semantic search), so it joins llm-net. Dedicated OAuth
  # token at secrets/google/openbrain-digest/token.json with gmail.send
  # scope.
  openbrain-digest:
    image: denoland/deno:alpine
    container_name: openbrain-digest
    restart: unless-stopped
    working_dir: /app
    env_file:
      - ../recipes/daily-digest/.env
    environment:
      # The digest is now the END of the chain (prune → podcast → digest). The
      # podcast triggers this digest when its research + episode are ready, so the
      # email is enriched (PodcastBriefSection reads the shared artifact). The
      # email still always sends: if the podcast produced nothing, the section is
      # omitted and the rest of the digest goes out. No onward trigger.
      NEXT_TRIGGER_URL: ""
      # J.1 (2026-08-21): per-lane virtual key for the master-key'd gateway
      LOCAL_LLM_BEARER: ${OB_DIGEST_LLM_KEY:-no-key}
    volumes:
      - ../recipes/daily-digest:/app
      - ../secrets/google/open-brain-email/client_secret_140943225735-jlldopci4llqu5i1ag7j08ks44a269jq.apps.googleusercontent.com.json:/app/credentials.json:ro
      - ../secrets/google/openbrain-digest/token.json:/app/token.json
      # Calendar OAuth token (calendar.readonly scope). Bootstrap once
      # via setup-calendar-token.ts. Missing token = CalendarSection
      # silently skips and the rest of the digest still goes out.
      - ../secrets/google/openbrain-digest/calendar-token.json:/app/calendar-token.json
      - D:\_data:/reports
    networks:
      # obnet for PostgREST queries; llm-net so the local LLM can write
      # the morning weather brief from wttr.in's JSON payload.
      - obnet
      - llm-net
    entrypoint: ["deno", "run", "--allow-net", "--allow-read", "--allow-write", "--allow-env", "send-digest.ts"]
    command: []

  # ── Gmail pull (HTTP-triggered) ─────────────────────────────────────
  # Long-running Deno HTTP service. POST /run with optional JSON body
  # triggers a pull cycle; cron fires at 01:00 local with the canonical
  # flag set (labelsPrefix=brain/, window=24h, limit=500). Ad-hoc runs
  # POST a different body. Reuses the open-brain-email OAuth client.
  openbrain-gmail-pull:
    image: denoland/deno:alpine
    container_name: openbrain-gmail-pull
    restart: unless-stopped
    working_dir: /app
    env_file:
      - ../recipes/email-history-import/.env
    environment:
      # On a successful pull, chain to prune (locked decision 13). Prune
      # then chains to digest. End-to-end: cron fires pull at 01:00, the
      # rest cascades. Set to empty string to disable chaining.
      NEXT_TRIGGER_URL: http://openbrain-gmail-prune:8080/run
    volumes:
      - ../recipes/email-history-import:/app
      - ../secrets/google/open-brain-email/client_secret_140943225735-jlldopci4llqu5i1ag7j08ks44a269jq.apps.googleusercontent.com.json:/app/credentials.json:ro
      - ../secrets/google/open-brain-email/token.json:/app/token.json
      - D:\_data:/reports
    networks:
      - obnet
      - llm-net
    entrypoint: ["deno", "run", "--allow-net", "--allow-read", "--allow-write", "--allow-env", "pull-gmail.ts"]
    command: []

  # ── Gmail prune (HTTP-triggered) ────────────────────────────────────
  # Long-running Deno HTTP service. POST /run triggers a prune cycle;
  # cron fires at 01:30 local (30 min after pull, per locked decision 13).
  # On completion, triggers wiki recompile via WIKI_RECOMPILE_URL.
  openbrain-gmail-prune:
    image: denoland/deno:alpine
    container_name: openbrain-gmail-prune
    restart: unless-stopped
    working_dir: /app
    env_file:
      - ../recipes/email-history-import/.env
    environment:
      # Chain to the PODCAST pipeline (reordered 2026-06-08). The podcast
      # researches the day's links and produces the episode, then triggers the
      # digest — so the morning email WAITS for and is enriched by the research.
      # Wiki recompile is triggered separately inside the script.
      NEXT_TRIGGER_URL: http://openbrain-podcast:8080/run
      # Safety: if the podcast service is unreachable (down/not deployed), send
      # the un-enriched email anyway so the morning digest is never lost.
      CHAIN_FALLBACK_URL: http://openbrain-digest:8080/run
    volumes:
      - ../recipes/email-history-import:/app
      - ../secrets/google/open-brain-email/client_secret_140943225735-jlldopci4llqu5i1ag7j08ks44a269jq.apps.googleusercontent.com.json:/app/credentials.json:ro
      - ../secrets/google/open-brain-email/token.json:/app/token.json
      - D:\_data:/reports
    networks:
      - obnet
      - llm-net
    entrypoint: ["deno", "run", "--allow-net", "--allow-read", "--allow-write", "--allow-env", "prune-short-term.ts"]
    command: []

  # ── Daily podcast (chain tail, HTTP-triggered) ──────────────────────
  # Long-running Deno HTTP service. openbrain-digest POSTs /run after the
  # morning email is sent. On /run it spawns the link-enrich pipeline:
  # follow newsletter links (via Tor) → grounded research through
  # openbrain-research (article mode: seed + OB-claim corroboration +
  # bounded preliminary gaps) → two-host script → Open Notebook audio →
  # loop-close (episode linked to the day's threads). Best-effort; the
  # email never waits on it.
  #
  # Networks: obnet (openbrain-rest / -research / open_notebook), llm-net
  # (llama-cpp for the script pass), search-gw-net (= ai-stack_default, where
  # the Mullvad `vpn` proxy lives since the ai-stack K.3 split — same seam
  # openbrain-research uses).
  # Needs --unstable-net (Tor proxy) + --allow-run (spawns link-enrich.ts).
  openbrain-podcast:
    image: denoland/deno:alpine
    container_name: openbrain-podcast
    restart: unless-stopped
    working_dir: /app
    env_file:
      - ../recipes/daily-digest/.env
    environment:
      PORT: "8080"
      PODCAST_RUN_ARGS: "--commit --audio"
      # When the pipeline finishes (success OR failure), trigger the digest so
      # the email goes out — enriched if the run produced a brief, plain if not.
      # This is what makes "email waits while healthy, sends when done/failed".
      NEXT_TRIGGER_URL: http://openbrain-digest:8080/run
      RESEARCH_URL: http://openbrain-research:8000
      # Deep-dive research is allowed to take a long time (the chain starts ~01:00
      # local for exactly this reason). The wait-gate must WAIT for each job's
      # genuine terminal state (done/error), NOT bail on an early timeout — so the
      # per-job poll deadline is hours, not the old 10 min. A job only becomes
      # email-only on a real terminal error, never because the clock ran out while
      # it was still queued/running. (research-service itself rides out llm-queue
      # 429 backpressure now, so "running" means real progress.)
      RESEARCH_WAIT_MS: ${RESEARCH_WAIT_MS:-7200000}   # 2h per job
      # ON audio (TTS) terminal-wait — generous so a slow-but-working render is not
      # cut off mid-generation. A genuine 'failed' still returns immediately.
      ON_JOB_WAIT_MS: ${ON_JOB_WAIT_MS:-7200000}       # 2h
      ON_BASE: http://open_notebook:5055
      # User-facing base for the EMAIL episode links — external + Authelia-gated.
      ON_PUBLIC_BASE: ${ON_PUBLIC_BASE:-https://notebook.devinveller.ai}
      CHAT_API_BASE: http://llama-cpp:8080/v1
      # J.1 (2026-08-21): per-lane virtual key for the master-key'd gateway
      CHAT_API_KEY: ${OB_PODCAST_LLM_KEY:-not-needed}
      BRAIN_REST_URL: http://openbrain-rest
      FETCH_PROXY_URL: http://vpn:8888  # 2026-08-21: Mullvad proxy (tor RETIRED - exits blocked by most sites)
      # ── Gap dives ──────────────────────────────────────────────────────────
      # When the email source lacked context (open [GAP]s, thin syntheses, email-
      # only items), triage the day's gaps into full research sessions on the
      # ob-research queue lane. THROTTLE = relevance to the source email (not a
      # fixed count): every gap central to its newsletter is researched, tangential
      # ones dropped. CEILING is only a runaway safety valve; overflow + unfinished
      # dives carry via /reports/gap-dives-pending.json, freshness-bounded, and
      # resolve into a follow-ups segment next morning. Best-effort; never blocks
      # the email. Rollback = GAP_DIVE_ENABLED=0 + recreate.
      # docs: implementation-guide/digest-gap-deep-research/
      GAP_DIVE_ENABLED: ${GAP_DIVE_ENABLED:-1}
      GAP_DIVE_CEILING: ${GAP_DIVE_CEILING:-12}          # runaway safety, NOT the throttle
      GAP_DIVE_MIN_TAGGED: ${GAP_DIVE_MIN_TAGGED:-2}     # < this grounded lines = "thin"
      GAP_DIVE_WAIT_MS: ${GAP_DIVE_WAIT_MS:-7200000}     # same-night budget (2h)
      GAP_DIVE_MAX_ATTEMPTS: ${GAP_DIVE_MAX_ATTEMPTS:-2} # resubmits before drop
      GAP_DIVE_MAX_AGE_DAYS: ${GAP_DIVE_MAX_AGE_DAYS:-3} # freshness: never dive staler
      MCP_ACCESS_KEY: ${MCP_ACCESS_KEY}
    volumes:
      - ../recipes/daily-digest:/app
      # Readonly Gmail token (same as the pull) — re-fetch raw email HTML so every
      # link survives for POI discovery. Token writable (OAuth refresh writes back).
      - ../secrets/google/open-brain-email/client_secret_140943225735-jlldopci4llqu5i1ag7j08ks44a269jq.apps.googleusercontent.com.json:/app/gmail-read-credentials.json:ro
      - ../secrets/google/open-brain-email/token.json:/app/gmail-read-token.json
      - D:\_data:/reports
    networks:
      - obnet
      - llm-net
      - search-gw-net
    entrypoint: ["deno", "run", "--unstable-net", "--allow-net", "--allow-read", "--allow-write", "--allow-env", "--allow-run", "podcast-server.ts"]
    command: []

  # ── Idea Refinery drain (IR.1, HTTP-triggered) ──────────────────────
  # Long-running Deno HTTP service. POST /run walks the owed-research queue
  # (ideas/idea_revisions, init-ideas.sql) and researches each owed idea via
  # openbrain-research — bounded submit-on-complete + rollover (§6.2). Stand-
  # alone (not chained); cron fires ~03:00 UTC, WELL BEFORE the 05:00-UTC gmail/
  # wiki chain, so new claims land before the 1am-local wiki compile (flywheel).
  #
  # PROFILE-GATED (`idea-refinery`): NOT started by a default `up` — stays off until
  # you deliberately enable it. IR.1 (drain) + IR.2 (Mattermost delivery) are built.
  # To go live: set IDEA_REFINERY_MM_TOKEN (+ optionally MM_SITE_URL) in OB1/docker/
  # .env, add that bot to your team and the #ideas channel, then:
  #   docker compose -f docker-compose.yml --profile idea-refinery up -d openbrain-idea-refinery
  # (At go-live, also sync the recovery-scripts inventory + /stack-map — new container.)
  openbrain-idea-refinery:
    profiles: ["idea-refinery"]
    image: denoland/deno:alpine
    container_name: openbrain-idea-refinery
    restart: unless-stopped
    working_dir: /app
    environment:
      PORT: "8080"
      DB_HOST: openbrain-db
      DB_USER: ob_app_memory
      DB_PASSWORD: ${OB_APP_MEMORY_PASSWORD}
      RESEARCH_URL: http://openbrain-research:8000
      MCP_ACCESS_KEY: ${MCP_ACCESS_KEY}
      IDEA_REFINERY_CHANNEL: "#ideas"
      # Mattermost (agent-org project, published on the host at :8065) — reached via
      # host.docker.internal. Set IDEA_REFINERY_MM_TOKEN in OB1/docker/.env to a bot
      # token (AO_MATTERMOST_BOT_TOKEN's value or a dedicated bot); the bot must be
      # ON A TEAM and in #ideas. MM_SITE_URL enables clickable permalinks (optional).
      MATTERMOST_URL: ${IDEA_REFINERY_MM_URL:-http://host.docker.internal:8065}
      MATTERMOST_TOKEN: ${IDEA_REFINERY_MM_TOKEN:-}
      MATTERMOST_SITE_URL: ${MM_SITE_URL:-}
      # LOCAL brainstorm (IR.4/IR.6): an operator reply under a dossier in #ideas is honed by the
      # LOCAL model via the gateway — the same plane the research uses. Nothing goes to cloud.
      CHAT_API_BASE: http://llama-cpp:8080/v1
      # J.1 (2026-08-21): per-lane virtual key for the master-key'd gateway
      CHAT_API_KEY: ${OB_PODCAST_LLM_KEY:-not-needed}
      # :nothink — brainstorm wants a direct reply; the thinking variant's reasoning tokens can eat
      # the budget and leave content empty (a silent non-reply). See index.ts CHAT_MODEL note.
      CHAT_MODEL: qwen36-27b:nothink
      IDEA_BRAINSTORM_OPERATORS: ${IDEA_BRAINSTORM_OPERATORS:-profnovice}
    volumes:
      - ../integrations/openbrain-idea-refinery:/app
    extra_hosts:
      # reach the host-published Mattermost (:8065) from inside this container
      - "host.docker.internal:host-gateway"
    networks:
      # obnet: openbrain-db + openbrain-research. llm-net kept for slice parity.
      - obnet
      - llm-net
    entrypoint: ["deno", "run", "--allow-net", "--allow-env", "index.ts"]
    command: []

networks:
  # Declared identically in docker-compose.yml; compose merges the
  # definitions when this file is included.
  obnet:
    driver: bridge
  llm-net:
    external: true
    name: ai-stack_llm-net
  # Mullvad-proxy egress for the podcast article fetches. Repointed 2026-08-21:
  # `vpn` moved to the ai-stack `search` plane project (K.3) and now presents
  # its :8888 proxy on the shared ai-stack_default bridge — the OLD
  # ai-stack_search-net no longer has it (that network is gone).
  search-gw-net:
    external: true
    name: ai-stack_default
