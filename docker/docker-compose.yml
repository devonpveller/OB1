# Open Brain (OB1) — self-hosted Docker Compose stack.
#
# Two services:
#   openbrain-db   PostgreSQL + pgvector, auto-initialised from init.sql
#   openbrain-mcp  Deno MCP server (from integrations/kubernetes-deployment)
#
# The MCP server joins the existing external `ai-stack_llm-net` network so it
# can reach the local models (llama-cpp for chat, llama-cpp-embed for
# embeddings). Secrets live in .env (not committed).

name: open-brain

# Scheduled services live in their own compose file. Compose merges
# everything into one project at parse time. See docker-compose.scheduled.yml.
include:
  - docker-compose.scheduled.yml

services:
  openbrain-db:
    image: pgvector/pgvector:pg16
    container_name: openbrain-db
    environment:
      POSTGRES_DB: openbrain
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - openbrain-db-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
      - ./init-extensions.sql:/docker-entrypoint-initdb.d/20-init-extensions.sql:ro
      - ./init-sources.sql:/docker-entrypoint-initdb.d/30-init-sources.sql:ro
      - ./init-graph.sql:/docker-entrypoint-initdb.d/40-init-graph.sql:ro
      - ./init-grants.sql:/docker-entrypoint-initdb.d/50-init-grants.sql:ro
      - ./init-source-graph.sql:/docker-entrypoint-initdb.d/60-init-source-graph.sql:ro
      # Integrated Knowledge System net-new schema (threads/sessions/joins
      # + content_hash + find_or_create_source). Runs after sources exist.
      # NB: initdb scripts only run on a FRESH volume; for the existing
      # openbrain-db-data volume the promotion runbook applies this via psql.
      - ./init-threads.sql:/docker-entrypoint-initdb.d/70-init-threads.sql:ro
      # ── Quartz-4-expansion additive migrations (fresh-volume only; the
      #    promotion runbook applies these to the live DB via psql — G3). ──
      - ./init-threads-slug.sql:/docker-entrypoint-initdb.d/72-init-threads-slug.sql:ro          # P2
      - ./init-source-revisions.sql:/docker-entrypoint-initdb.d/80-init-source-revisions.sql:ro  # P4
      - ./init-source-retract.sql:/docker-entrypoint-initdb.d/82-init-source-retract.sql:ro      # P4
      - ./init-content-types.sql:/docker-entrypoint-initdb.d/84-init-content-types.sql:ro        # P5
      - ./init-source-chunks.sql:/docker-entrypoint-initdb.d/86-init-source-chunks.sql:ro        # P5
      - ./init-import-jobs.sql:/docker-entrypoint-initdb.d/88-init-import-jobs.sql:ro            # P5
      - ./init-source-editing.sql:/docker-entrypoint-initdb.d/90-init-source-editing.sql:ro     # P4.7
      # ── Research-inlet additive migration (fresh-volume only; the promotion
      #    runbook applies this to the live DB via psql — G3). ──
      - ./init-thread-embedding.sql:/docker-entrypoint-initdb.d/92-init-thread-embedding.sql:ro  # research-inlet P0
      # ── Research Engine claims layer (fresh-volume only; the promotion
      #    runbook applies this to the live DB via psql — G3). ──
      - ./init-claims.sql:/docker-entrypoint-initdb.d/94-init-claims.sql:ro                      # research-engine P1
      - ./init-research-jobs.sql:/docker-entrypoint-initdb.d/96-init-research-jobs.sql:ro         # research-engine P4
      # ── Idea Refinery lifecycle tables (fresh-volume only; operator applies
      #    to the live DB via psql — same pattern as the claims layer). ──
      - ./init-ideas.sql:/docker-entrypoint-initdb.d/98-init-ideas.sql:ro                        # idea-refinery IR.0
    networks:
      - obnet
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d openbrain"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  openbrain-mcp:
    build:
      context: ../integrations/kubernetes-deployment
      dockerfile: Dockerfile
    image: openbrain-mcp-server:local
    container_name: openbrain-mcp
    depends_on:
      openbrain-db:
        condition: service_healthy
    environment:
      DB_HOST: openbrain-db
      DB_PORT: "5432"
      DB_NAME: openbrain
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      MCP_ACCESS_KEY: ${MCP_ACCESS_KEY}
      PORT: "8000"
      # Embeddings -> local bge-m3 (1024-dim) on the ai-stack llm-net
      EMBEDDING_API_BASE: http://llama-cpp-embed:8080/v1
      EMBEDDING_API_KEY: ${OB_MCP_LLM_KEY:-not-needed}
      EMBEDDING_MODEL: bge-m3
      # Chat (metadata extraction) -> local Qwen, non-thinking variant
      CHAT_API_BASE: http://llama-cpp:8080/v1
      CHAT_API_KEY: ${OB_MCP_LLM_KEY:-not-needed}
      CHAT_MODEL: qwen36-27b:nothink
      # Tool-result size caps (see index.ts capResultText). Every tool response
      # is truncated to ~this many chars (~4/token) so multi-tool research turns
      # can't blow past the qwen36-27b context lane (the "tools respond, model
      # stops" / llama.cpp 400 overflow). On truncation the model is told to
      # narrow and call again. Adjust freely; 0 disables. Per-tool override:
      # OB_TOOL_RESULT_MAX_CHARS_<TOOL> (e.g. _LIST_THREADS, _SEARCH_CLAIMS).
      OB_TOOL_RESULT_MAX_CHARS: "12000"
      # fetch returns ONE full document for citation (not the accumulation
      # culprit) — leave it uncapped so citations stay complete.
      OB_TOOL_RESULT_MAX_CHARS_FETCH: "0"
    # No host port: openbrain-mcp is reachable only on internal networks.
    # Trusted local clients (Open WebUI via openbrain-mcpo, recipes on
    # obnet) talk to it directly. Cloud services (Claude Code, etc.)
    # must go through openbrain-gateway, which is the only host-published
    # door and enforces the privacy policy (mirrors the mnemory lockdown).
    networks:
      - obnet
      - llm-net
    restart: unless-stopped

  # Combined extensions MCP server: all 6 OB1 extensions (39 tools),
  # ported to raw PostgreSQL. Shares openbrain-db; no model/internet
  # access needed.
  openbrain-ext:
    build:
      context: ./extensions-server
      dockerfile: Dockerfile
    image: openbrain-ext-server:local
    container_name: openbrain-ext
    depends_on:
      openbrain-db:
        condition: service_healthy
    environment:
      DB_HOST: openbrain-db
      DB_PORT: "5432"
      DB_NAME: openbrain
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DEFAULT_USER_ID: ${DEFAULT_USER_ID}
      MCP_ACCESS_KEY: ${MCP_ACCESS_KEY}
      PORT: "8000"
      # Compiled wiki (read-only) for the wiki_* tools (req 13).
      WIKI_DIR: /wiki/content
      WIKI_RECOMPILE_URL: http://openbrain-wiki:8000/recompile
    volumes:
      - openbrain-wiki-data:/wiki:ro
    # No host port: extensions (39 CRM/family/household tools) are
    # personal-by-design and have no cloud surface. Reachable internally
    # via openbrain-mcpo-ext for OWUI; cloud is denied entirely (the
    # openbrain-gateway allow-list excludes every extension tool).
    networks:
      - obnet
    restart: unless-stopped

  # Privacy-enforcing MCP proxy for CLOUD services (Claude Code, ChatGPT,
  # etc). Only host-published openbrain door. Holds the real x-brain-key;
  # cloud clients use OPENBRAIN_GATEWAY_KEY and never see the upstream
  # key. Forces metadata.share=cloud on reads, stamps metadata.origin=
  # cloud,share=cloud on writes, blocks thought_stats (unfilterable
  # aggregate) + all extension tools. Mirrors mnemory-gateway/app.py.
  openbrain-gateway:
    # Image is BUILT IN THE ai-stack REPO (its source lives beside its twin
    # mnemory-cloud-gateway there, so the E.1 unification stays in one place).
    # Build/refresh from ai-stack: `docker build -t openbrain-gateway:local
    # ./openbrain-gateway`. This project only CONSUMES the image, so an
    # OB1-only clone (submodule) is self-contained. (Was a ../../ build
    # context; decoupled 2026-08-21 for the H.1 submodule conversion.)
    image: openbrain-gateway:local
    pull_policy: never
    container_name: openbrain-gateway
    depends_on:
      - openbrain-mcp
    environment:
      OPENBRAIN_URL: http://openbrain-mcp:8000
      OPENBRAIN_KEY: ${MCP_ACCESS_KEY}
      GATEWAY_KEY: ${OPENBRAIN_GATEWAY_KEY}
      SHARE_LABEL_VALUE: cloud
    ports:
      - "127.0.0.1:8061:8061"
    # obnet is a normal bridge (not internal), so host port publishing
    # works directly from it — no extra network needed (unlike the main
    # stack where mnemory-gateway joins `default` because llm-net is
    # internal).
    networks:
      - obnet
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8061/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # MCP -> OpenAPI bridges for Open WebUI (which consumes OpenAPI tool
  # servers, not raw MCP). ONE mcpo per MCP server: mcpo's Python client
  # crashes (anyio cancel-scope) when a single instance proxies multiple
  # streamable-http servers, so core and extensions get separate
  # instances. Reachable from openwebui over the shared ai-stack_llm-net.
  openbrain-mcpo:
    image: ghcr.io/open-webui/mcpo:latest
    container_name: openbrain-mcpo
    depends_on:
      - openbrain-mcp
    command:
      - --config
      - /config/mcpo.config.json
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --api-key
      - ${MCPO_API_KEY}
    volumes:
      - ./mcpo.config.json:/config/mcpo.config.json:ro
    networks:
      - obnet
      - llm-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/open-brain/openapi.json')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  openbrain-mcpo-ext:
    image: ghcr.io/open-webui/mcpo:latest
    container_name: openbrain-mcpo-ext
    depends_on:
      - openbrain-ext
    command:
      - --config
      - /config/mcpo-ext.config.json
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --api-key
      - ${MCPO_API_KEY}
    volumes:
      - ./mcpo-ext.config.json:/config/mcpo-ext.config.json:ro
    networks:
      - obnet
      - llm-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/open-brain-extensions/openapi.json')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # PostgREST over openbrain-db — the API surface the wiki-compiler
  # scripts expect (they were written for Supabase /rest/v1). Local
  # only: loopback host port + obnet. anon-role = service_role (single
  # user, same app-layer-trust posture as the MCP server as superuser).
  openbrain-postgrest:
    image: postgrest/postgrest:v12.2.3
    container_name: openbrain-postgrest
    depends_on:
      openbrain-db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://postgres:${POSTGRES_PASSWORD}@openbrain-db:5432/openbrain
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: service_role
      PGRST_DB_POOL: "10"
      PGRST_SERVER_PORT: "3000"
    networks:
      - obnet
    restart: unless-stopped

  # Path-stripping proxy: exposes the Supabase `/rest/v1/*` convention
  # the wiki-compiler scripts expect, onto root-served PostgREST. This
  # is what the recipe scripts point OPEN_BRAIN_URL at — keeping them
  # unmodified. Loopback host port for host-run compiles; obnet name
  # for in-container scheduled compiles.
  openbrain-rest:
    image: caddy:2-alpine
    container_name: openbrain-rest
    depends_on:
      - openbrain-postgrest
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "127.0.0.1:3001:80"
    networks:
      - obnet
    restart: unless-stopped

  # Entity-extraction worker (upstream OB1 integration, B.5-patched for
  # local LLM). Drains entity_extraction_queue (auto-filled by the
  # thoughts trigger), calls qwen36-27b:nothink for entity/relation
  # extraction + bge-m3 for embeddings, writes entities/thought_entities/
  # edges. Talks to the DB via the Caddy /rest/v1 proxy (supabase-js
  # appends /rest/v1; Caddy strips it → PostgREST). On obnet (reach
  # openbrain-rest) + llm-net (reach the local models). HTTP-invoked
  # (loopback 8810) — drain on demand / via a future scheduler.
  openbrain-entity-worker:
    build:
      context: ../integrations/entity-extraction-worker
      dockerfile: Dockerfile
    image: openbrain-entity-worker:local
    container_name: openbrain-entity-worker
    depends_on:
      - openbrain-rest
    environment:
      # supabase-js → Caddy /rest/v1 proxy → PostgREST (anon=service_role).
      # PostgREST has no JWT secret, so the key value is not verified;
      # supabase-js only requires it be non-empty.
      SUPABASE_URL: http://openbrain-rest
      SUPABASE_SERVICE_ROLE_KEY: ${MCP_ACCESS_KEY}
      MCP_ACCESS_KEY: ${MCP_ACCESS_KEY}
      # Local OpenAI-compatible chat (entity/relation extraction).
      CHAT_API_BASE: http://llama-cpp:8080/v1
      CHAT_API_KEY: ${OB_ENTITY_LLM_KEY:-not-needed}
      CHAT_MODEL: qwen36-27b:nothink
      # Local embeddings (bge-m3, 1024-dim).
      EMBEDDING_API_BASE: http://llama-cpp-embed:8080/v1
      EMBEDDING_API_KEY: ${OB_ENTITY_LLM_KEY:-not-needed}
      EMBEDDING_MODEL: bge-m3
      EMBEDDING_DIMENSION: "1024"
      PORT: "8000"
    ports:
      - "127.0.0.1:8810:8000"
    networks:
      - obnet
      - llm-net
    restart: unless-stopped

  # Cross-thread suggestion worker (Integrated Knowledge System, Phase 5).
  # Proposes (never auto-creates) cross-thread source links by semantic
  # similarity over `sources.embedding`; writes only suggested/pending rows
  # (confirmation is a deliberate user act in the Open Notebook triage UI).
  # Talks to openbrain-db DIRECTLY (deno-postgres, like openbrain-mcp) and to
  # llama-cpp-embed for bge-m3 backfill. HTTP-invoked (loopback 8813):
  # POST /suggest drains + scores on demand / via a future scheduler.
  openbrain-suggestion-worker:
    build:
      context: ../integrations/suggestion-worker
      dockerfile: Dockerfile
    image: openbrain-suggestion-worker:local
    container_name: openbrain-suggestion-worker
    depends_on:
      openbrain-db:
        condition: service_healthy
    environment:
      DB_HOST: openbrain-db
      DB_PORT: "5432"
      DB_NAME: openbrain
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      EMBEDDING_API_BASE: http://llama-cpp-embed:8080/v1
      EMBEDDING_API_KEY: ${OB_ENTITY_LLM_KEY:-not-needed}
      EMBEDDING_MODEL: bge-m3
      # Cross-thread similarity cutoff (tune with real data — open-Q #1).
      SUGGESTION_THRESHOLD: ${SUGGESTION_THRESHOLD:-0.50}
      PORT: "8000"
    ports:
      - "127.0.0.1:8813:8000"
    networks:
      - obnet
      - llm-net
    restart: unless-stopped

  # Research-package ingestion inlet / curator (research-inlet plan). The single
  # front door for deep-research output: deep_research POSTs a "package"
  # (synthesis + sources + topic hint) here instead of straight to
  # /research/persist. The curator OWNS the thread decision — it resolves each
  # package onto the best existing thread (Stage 1: pgvector shortlist over
  # threads.embedding; Stage 2: LLM decision, conservative-merge bias) or creates
  # a new thread, then DELEGATES the write to openbrain-mcp's /research/persist
  # with the resolved thread_id injected, and refreshes the thread's
  # description+embedding so matching improves over time. Stops OB1 fragmenting
  # into one thread per run. Talks to openbrain-db DIRECTLY (deno-postgres) +
  # llama-cpp (chat) + llama-cpp-embed (bge-m3). obnet (reach openbrain-mcp /
  # db) + llm-net (reach the models). HTTP-invoked (loopback 8816):
  # POST /ingest/research-package.
  openbrain-curator:
    build:
      context: ../integrations/research-curator
      dockerfile: Dockerfile
    image: openbrain-curator:local
    container_name: openbrain-curator
    depends_on:
      openbrain-db:
        condition: service_healthy
      openbrain-mcp:
        condition: service_started
    environment:
      DB_HOST: openbrain-db
      DB_PORT: "5432"
      DB_NAME: openbrain
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      # Shared brain key — authenticates inbound ingests AND the outbound
      # delegation to openbrain-mcp /research/persist.
      MCP_ACCESS_KEY: ${MCP_ACCESS_KEY}
      # Delegate the actual write to the existing persist endpoint.
      PERSIST_URL: http://openbrain-mcp:8000
      # Local embeddings (bge-m3, 1024-dim) for the thread shortlist.
      EMBEDDING_API_BASE: http://llama-cpp-embed:8080/v1
      EMBEDDING_API_KEY: ${OB_RESEARCH_LLM_KEY:-not-needed}
      EMBEDDING_MODEL: bge-m3
      # Local chat (qwen, non-thinking) for the thread-resolution decision.
      CHAT_API_BASE: http://llama-cpp:8080/v1
      CHAT_API_KEY: ${OB_RESEARCH_LLM_KEY:-not-needed}
      CHAT_MODEL: qwen36-27b:nothink
      # Resolver tuning (override via .env). See PLAN §3.4.
      SHORTLIST_K: ${CURATOR_SHORTLIST_K:-5}
      NEW_THREAD_MIN_CONFIDENCE: ${CURATOR_NEW_THREAD_MIN_CONFIDENCE:-0.60}
      MERGE_FLOOR_DISTANCE: ${CURATOR_MERGE_FLOOR_DISTANCE:-0.45}
      # Conflict detection (#2): judge a new claim against an existing thread claim
      # within this cosine distance; reciprocal contradicts edges on conflict.
      CONFLICT_DISTANCE: ${CURATOR_CONFLICT_DISTANCE:-0.25}
      PORT: "8000"
    ports:
      - "127.0.0.1:8816:8000"
    networks:
      - obnet
      - llm-net
    restart: unless-stopped

  # Shared research harness (Research Engine P3/P4). One harness, many thin
  # inlets (OWUI deep_research tool, future agents, Open Notebook). It reuses
  # grounded+fresh claims from the OB KB, analyses coverage → gaps, stages ONLY
  # the gaps (SearXNG search → per-page fetch+extract), synthesizes verbatim with
  # claim-level [Source N] citations, ENFORCES grounding (degrades to honest
  # [GAP]s on backstop, never fabricates), and DELEGATES placement + claim
  # writing to openbrain-curator (OD-2). Async job+poll (OD-3): POST /research →
  # job_id; GET /research/jobs/:id (or .../stream SSE). Talks to openbrain-db
  # (deno-postgres, KB read + staging), llama-cpp (chat) + llama-cpp-embed
  # (bge-m3), the curator, and the private SearXNG gateway. obnet + llm-net.
  # HTTP-invoked (loopback 8818). NOTE: reaching the SearXNG gateway is a
  # cross-stack seam — set SEARCH_API_BASE to a URL reachable from obnet/llm-net
  # (the gateway lives in the MAIN stack); if search is unreachable the harness
  # degrades to honest gaps (rule #1), it never fabricates.
  openbrain-research:
    build:
      context: ../integrations/research-service
      dockerfile: Dockerfile
    image: openbrain-research:local
    container_name: openbrain-research
    depends_on:
      openbrain-db:
        condition: service_healthy
      openbrain-curator:
        condition: service_started
    environment:
      DB_HOST: openbrain-db
      DB_PORT: "5432"
      DB_NAME: openbrain
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      MCP_ACCESS_KEY: ${MCP_ACCESS_KEY}
      # Async chat callback: where a finished job announces itself. A research run
      # outlives the OWUI tool call that submitted it, so the report is POSTed into
      # the originating chat message instead of the caller blocking on a poll.
      # Cross-stack: openbrain-research reaches openwebui over ai-stack_default.
      # The URL + key live HERE, never in the request body — a caller-supplied
      # callback target would let anyone who can enqueue a job aim this service's
      # authenticated POST at an arbitrary host. Leave OWUI_API_KEY empty to
      # disable the callback; clients then fall back to polling. NOTE: this
      # project resolves ${...} against OB1/docker/.env, not the main stack .env.
      OWUI_BASE_URL: ${RESEARCH_OWUI_BASE_URL:-http://openwebui:8080}
      OWUI_API_KEY: ${RESEARCH_OWUI_API_KEY:-}
      # Delegate placement + grounded-claim writing to the deployed curator (OD-2).
      CURATOR_URL: http://openbrain-curator:8000
      # Private SearXNG-over-Tor gateway (cross-stack — override to a reachable URL).
      SEARCH_API_BASE: ${RESEARCH_SEARCH_API_BASE:-http://gateway:8080}
      EMBEDDING_API_BASE: http://llama-cpp-embed:8080/v1
      EMBEDDING_API_KEY: ${OB_RESEARCH_LLM_KEY:-not-needed}
      EMBEDDING_MODEL: bge-m3
      CHAT_API_BASE: http://llama-cpp:8080/v1
      CHAT_API_KEY: ${OB_RESEARCH_LLM_KEY:-not-needed}
      CHAT_MODEL: ${RESEARCH_CHAT_MODEL:-qwen36-27b}
      NOTHINK_SUFFIX: ":nothink"
      # Concurrency: how many research jobs run at once across the stack. Default
      # 1 = strict global serialization so a burst of research can't flood LiteLLM
      # / the llm-queue admission controller; jobs queue FIFO and a drain loop
      # dispatches them. Raise only if the inference plane can absorb concurrent fan-out.
      RESEARCH_MAX_CONCURRENCY: ${RESEARCH_MAX_CONCURRENCY:-1}
      # Harness tuning (override via .env). See PLAN §5/§6 + OD-5/OD-6.
      SEARCH_K: ${RESEARCH_SEARCH_K:-8}
      CLAIM_SHORTLIST_K: ${RESEARCH_CLAIM_SHORTLIST_K:-12}
      CONFIDENCE_FLOOR: ${RESEARCH_CONFIDENCE_FLOOR:-0.50}
      # Reuse recall: drop claims farther than this cosine distance (#5).
      REUSE_MAX_DISTANCE: ${RESEARCH_REUSE_MAX_DISTANCE:-0.55}
      # Iterative deepening: max gather rounds (refine queries until covered) (#1).
      MAX_ROUNDS: ${RESEARCH_MAX_ROUNDS:-3}
      FETCH_TIMEOUT_MS: ${RESEARCH_FETCH_TIMEOUT_MS:-15000}
      FETCH_MAX_CHARS: ${RESEARCH_FETCH_MAX_CHARS:-8000}
      FETCH_CONCURRENCY: ${RESEARCH_FETCH_CONCURRENCY:-4}
      # MAX_FETCH = source-YIELD budget (pages actually retrieved). NOT charged
      # for timeouts or OB cache reuse — those are tracked separately.
      # Raised 40 -> 80 (2026-08-20): a broad "state of the field" run stopped on
      # max_fetch at 40 pages having grounded only 25% of its claims. The three
      # ceilings below are COUPLED — lifting this one alone just trades a
      # max_fetch stop for a wall_time one, so they move together.
      MAX_FETCH: ${RESEARCH_MAX_FETCH:-80}
      # MAX_FETCH_TIMEOUTS = SEPARATE ceiling on wasted fetch timeouts (flaky
      # Tor). Stops a run burning wall-time on dead fetches and surfaces a
      # distinct "max_timeouts" stop reason. 0 disables this ceiling. Scaled with
      # MAX_FETCH; left behind it would simply become the new binding stop.
      MAX_FETCH_TIMEOUTS: ${RESEARCH_MAX_FETCH_TIMEOUTS:-40}
      # 5 min -> 15 min. Affordable now only because a run no longer holds a chat
      # turn open: the async callback returns the report to the chat message when
      # the job finishes, so wall-time costs queue depth rather than an operator
      # sitting and waiting. Jobs still run one at a time — this is the knob that
      # decides how long a queued job waits behind a deep one.
      MAX_WALL_MS: ${RESEARCH_MAX_WALL_MS:-900000}
      # Page fetches egress through Tor (socks5h = DNS via Tor too, matching
      # SearXNG). Reaches tor:9050 over ai-stack_default. "" = direct. Needs the
      # --unstable-net flag (added in the Dockerfile).
      FETCH_PROXY_URL: ${RESEARCH_FETCH_PROXY_URL:-socks5h://tor:9050}
      # Bounded preliminary gap research for article-mode (podcast) jobs.
      PRELIM_MAX_FETCH: ${RESEARCH_PRELIM_MAX_FETCH:-6}
      PRELIM_GAP_LIMIT: ${RESEARCH_PRELIM_GAP_LIMIT:-3}
      PORT: "8000"
    ports:
      - "127.0.0.1:8818:8000"
    networks:
      - obnet
      - llm-net
      - search-gw-net   # reach the private SearXNG gateway (search-over-Tor)
    restart: unless-stopped

  # Wiki compiler + scheduler + on-demand trigger. Runs the (B.2/B.3-
  # extended) entity-wiki recipe --batch into the shared wiki volume,
  # then git-commits (D16: local commits only — no remote, no secrets).
  # Compiles: on boot, deterministically at WIKI_RECOMPILE_HOUR local
  # time daily (default 01:00 — set TZ so that = your 1am), whenever new
  # research/sources/thoughts settle (change-watch, debounced), and on
  # POST /recompile (the wiki_trigger_recompile MCP tool).
  # obnet (openbrain-rest) + llm-net (qwen36-27b:nothink / bge-m3).
  openbrain-wiki:
    build:
      context: ./wiki-service
      dockerfile: Dockerfile
    image: openbrain-wiki:local
    container_name: openbrain-wiki
    depends_on:
      - openbrain-rest
      - openbrain-entity-worker
    environment:
      OPEN_BRAIN_URL: http://openbrain-rest
      OPEN_BRAIN_SERVICE_KEY: local-trust
      MCP_ACCESS_KEY: ${MCP_ACCESS_KEY}
      # P4.7 — commit working source-content edits as revisions, one per compile
      # (service-to-service call to the workbench; needs the X-Brain-Key).
      WORKBENCH_URL: http://openbrain-workbench:8000
      WORKBENCH_KEY: ${MCP_ACCESS_KEY}
      LLM_BASE_URL: http://llama-cpp:8080/v1
      LLM_API_KEY: not-needed
      LLM_MODEL: qwen36-27b:nothink
      EMBEDDING_BASE_URL: http://llama-cpp-embed:8080/v1
      EMBEDDING_API_KEY: ${OB_WIKI_LLM_KEY:-not-needed}
      EMBEDDING_MODEL: bge-m3
      EMBEDDING_DIMENSION: "1024"
      WIKI_OUT_DIR: /wiki/content
      WIKI_GIT_DIR: /wiki
      RECIPE_PATH: /recipes/entity-wiki/generate-wiki.mjs
      # ── Wiki compile schedule (override via .env / shell, no edits
      #    needed): WIKI_TZ, WIKI_RECOMPILE_HOUR, WIKI_WATCH_* ──────────
      # Timezone the daily hour is interpreted in (IANA name; handles
      # EST/EDT automatically). Default America/New_York (US Eastern).
      TZ: ${WIKI_TZ:-America/New_York}
      # Deterministic daily compile at this LOCAL hour (0-23), in TZ above.
      WIKI_RECOMPILE_HOUR: ${WIKI_RECOMPILE_HOUR:-1}
      # Change-driven recompile: research/sources land → debounced compile
      # a few minutes after activity settles (no fixed-interval GPU churn).
      WIKI_WATCH_ENABLED: ${WIKI_WATCH_ENABLED:-true}
      WIKI_WATCH_INTERVAL_MIN: ${WIKI_WATCH_INTERVAL_MIN:-3}
      COMPILE_ON_BOOT: ${WIKI_COMPILE_ON_BOOT:-true}
      WIKI_BATCH_MIN_LINKED: "1"
      WIKI_MAX_SOURCES: "5"
      # Recipe-execution timeouts (minutes). A FULL compile of the whole
      # graph plus topic synthesis can outrun 1-2h once the thought corpus
      # grows; killing pexec mid-write leaves an unstaged dirty tree that
      # blocks the next pull --rebase. Generous defaults; tune if needed.
      WIKI_COMPILE_TIMEOUT_MIN: ${WIKI_COMPILE_TIMEOUT_MIN:-240}
      WIKI_SYNTH_TIMEOUT_MIN: ${WIKI_SYNTH_TIMEOUT_MIN:-120}
      # Optional notebook/project scoping (req 10). Empty = whole brain.
      # Set to a notebook name to compile only in-scope sources + thoughts
      # (thoughts tagged metadata.notebook=<name>).
      WIKI_NOTEBOOK: ""
      # Optional private-remote push (opt-in). Unset WIKI_GIT_REMOTE =
      # D16 local-commits-only (unchanged). When set, the deploy key is
      # read from WIKI_GIT_SSH_KEY (mounted, gitignored). SSH URL form.
      # ── 2026-06-10: remote push SEVERED at operator request ("sever the git
      #    link for now and stop pushing to git"). WIKI_GIT_REMOTE blanked →
      #    compiler reverts to local-commits-only: vault history is kept (the
      #    notes/revision system needs it) but nothing is pulled or pushed to
      #    openbrain-wiki-data.git. To re-enable: restore the SSH URL below.
      WIKI_GIT_REMOTE: ""
      # WIKI_GIT_REMOTE: "git@github.com:devonpveller/openbrain-wiki-data.git"
      WIKI_GIT_SSH_KEY: /secrets/deploy_key
      WIKI_GIT_BRANCH: main
      PORT: "8000"
    volumes:
      - openbrain-wiki-data:/wiki
      - ../recipes:/recipes:ro
      # Passphrase-less deploy private key for the wiki repo (host path
      # is gitignored via /secrets/). Read-only.
      # Path parameterized 2026-08-21 (H.1): the parent points this at its
      # secrets dir; standalone OB1 sets WIKI_DEPLOY_KEY_PATH to its own.
      - ${WIKI_DEPLOY_KEY_PATH:-../../secrets/openbrain-wiki-deploy_key}:/secrets/deploy_key:ro
    ports:
      - "127.0.0.1:8811:8000"
    networks:
      - obnet
      - llm-net
    restart: unless-stopped

  # Read-only Quartz 4 viewer (D15). Renders the compiled markdown +
  # [[wikilinks]] + graph into a static site, rebuilding on change.
  # Content is the shared wiki volume (read-only); fully regenerable.
  openbrain-wiki-viewer:
    build:
      context: ./wiki-viewer
      dockerfile: Dockerfile
    image: openbrain-wiki-viewer:local
    container_name: openbrain-wiki-viewer
    logging: # sysadmin log cap (disk-prune-watcher); applies on recreate
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"
    depends_on:
      - openbrain-wiki
    environment:
      # Quartz's `build --serve` watcher uses inotify by default, which does NOT
      # reliably fire for the compiler's writes across the /quartz/content→/wiki
      # symlink to a Docker volume owned by openbrain-wiki (cross-container). That
      # left the served build refreshing only at the nightly clean rebuild. Poll
      # instead so intraday content updates re-render within seconds and the
      # idle-swap publishes them.
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "${WIKI_VIEWER_POLL_INTERVAL_MS:-5000}"
      # A cold full build of the whole vault holds every parsed AST in memory at
      # once; the default ~2GB node heap OOMs as the vault grows (the OWUI
      # knowledge-collection migration pushed it past 12k pages / ~200MB). Give
      # the Quartz builder real headroom (host has ~94GB). Configurable.
      NODE_OPTIONS: "--max-old-space-size=${WIKI_VIEWER_HEAP_MB:-20480}"
    volumes:
      - openbrain-wiki-data:/wiki:ro
      # Binary assets (images now, audio later) live on their own volume,
      # decoupled from the git vault (D-I). Mounted at the vault-root `assets/`
      # path so Quartz resolves `![](assets/<id>/img.png)` links; read-only
      # here (the workbench is the writer).
      - wiki-assets:/wiki/assets:ro
    ports:
      - "127.0.0.1:8812:8080"
    networks:
      - obnet
      # ai-stack portal network (external). The viewer joins it so BOTH the
      # portal Caddy (external link, wiki.${PUBLIC_DOMAIN}) and the tailscale
      # container — which shares openwebui's netns, and openwebui is on
      # app-net — can reach openbrain-wiki-viewer:8080 by name.
      - app-net
    restart: unless-stopped

  # Browser-facing read/write API behind the Quartz viewer (D-A). Deno+Hono,
  # internal :8000. Reached SAME-ORIGIN via the portal Caddy
  # `handle /workbench/* { reverse_proxy openbrain-workbench:8000 }`, which
  # injects the shared secret as X-Brain-Key — the browser never holds it (G7).
  # Talks to openbrain-db DIRECTLY (deno-postgres) for atomic writes (G8) and to
  # PostgREST (openbrain-rest) for reads. NOT host-published except an optional
  # loopback debug port. Networks: obnet + llm-net + app-net (app-net is
  # REQUIRED so the portal Caddy can resolve this name by DNS — §2.3).
  openbrain-workbench:
    build:
      context: ./workbench
      dockerfile: Dockerfile
    image: openbrain-workbench:local
    container_name: openbrain-workbench
    depends_on:
      openbrain-db:
        condition: service_healthy
      openbrain-rest:
        condition: service_started
    environment:
      PORT: "8000"
      # Caddy injects this as X-Brain-Key when proxying; reuse MCP_ACCESS_KEY.
      WORKBENCH_KEY: ${MCP_ACCESS_KEY}
      # Direct Postgres (atomic multi-row writes — G8).
      DB_HOST: openbrain-db
      DB_PORT: "5432"
      DB_NAME: openbrain
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      # PostgREST reads (via the OB1 Caddy /rest/v1 proxy).
      OPEN_BRAIN_URL: http://openbrain-rest
      # Local embeddings (bge-m3, 1024-dim) for chunk/source embedding (P5/P6).
      EMBEDDING_API_BASE: http://llama-cpp-embed:8080/v1
      EMBEDDING_API_KEY: ${OB_MCP_LLM_KEY:-not-needed}
      EMBEDDING_MODEL: bge-m3
      EMBEDDING_DIMENSION: "1024"
      # Extraction sidecar (P5).
      EXTRACT_URL: http://openbrain-extract:8000
      # Vault (notes write path + Changes log, P3) + binary assets (P5).
      WIKI_GIT_DIR: /wiki
      WIKI_OUT_DIR: /wiki/content
      WIKI_ASSETS_DIR: /wiki/assets
    volumes:
      # rw: the workbench is the asset writer and the notes/Changes-log writer.
      - openbrain-wiki-data:/wiki
      - wiki-assets:/wiki/assets
      # Shared canonical slug module (G5), same mount the wiki container uses.
      - ../recipes:/recipes:ro
    # Optional loopback debug publish ONLY (same-origin path is via Caddy).
    ports:
      - "127.0.0.1:8814:8000"
    networks:
      - obnet
      - llm-net
      - app-net
    healthcheck:
      test: ["CMD", "deno", "eval", "const r=await fetch('http://localhost:8000/health');Deno.exit(r.ok?0:1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # Content extraction sidecar (P5.1). Stable POST /extract over a
  # format→extractor registry (PDF/DOCX/PPTX/image-OCR/audio-STT). Parses
  # UNTRUSTED files → sandboxed: non-root (Dockerfile uid 10020), cap_drop ALL,
  # no-new-privileges, read-only root FS + tmpfs. Reaches the host STT endpoint
  # (the one allowed egress) via host.docker.internal; otherwise obnet-only so
  # the workbench can call it by name. Not host-published except a loopback
  # debug port.
  openbrain-extract:
    build:
      context: ./extract
      dockerfile: Dockerfile
    image: openbrain-extract:local
    container_name: openbrain-extract
    environment:
      # Local STT for audio/video. The ai-stack realtime-audio server's one-shot
      # endpoint is POST /stt (field "audio_file") → { transcript } — NOT the
      # OpenAI /v1/audio/transcriptions path.
      STT_API_BASE: ${EXTRACT_STT_API_BASE:-http://host.docker.internal:8000}
      STT_TRANSCRIBE_PATH: ${EXTRACT_STT_PATH:-/stt}
      EXTRACT_MAX_BYTES: ${EXTRACT_MAX_BYTES:-104857600}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8815:8000"   # loopback debug only
    networks:
      - obnet
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=256m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # Canonical chunk-embedding worker (Integrated Knowledge System / passage-level
  # retrieval). Writer-agnostic: chunks ANY OB1 source into `source_chunks`
  # (1200/150 chars + bge-m3, 1024-dim) so every frontend's vector retrieval
  # works — including Open Notebook's "ask your knowledge base" (chat/search RPCs
  # read source_chunks). Scans on an interval; also drainable via POST /chunks.
  # Talks to openbrain-db DIRECTLY (deno-postgres, like the suggestion worker)
  # and to llama-cpp-embed for embeddings. obnet (db) + llm-net (models).
  # HTTP-invoked (loopback 8817).
  openbrain-chunk-worker:
    build:
      context: ../integrations/chunk-embedding-worker
      dockerfile: Dockerfile
    image: openbrain-chunk-worker:local
    container_name: openbrain-chunk-worker
    depends_on:
      openbrain-db:
        condition: service_healthy
    environment:
      DB_HOST: openbrain-db
      DB_PORT: "5432"
      DB_NAME: openbrain
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      EMBEDDING_API_BASE: http://llama-cpp-embed:8080/v1
      EMBEDDING_API_KEY: ${OB_ENTITY_LLM_KEY:-not-needed}
      EMBEDDING_MODEL: bge-m3
      CHUNK_BATCH: ${CHUNK_BATCH:-25}
      CHUNK_INTERVAL_MS: ${CHUNK_INTERVAL_MS:-15000}
      PORT: "8000"
    ports:
      - "127.0.0.1:8817:8000"
    networks:
      - obnet
      - llm-net
    restart: unless-stopped

  # ── Grounding backfiller (S2 — brain-health) ────────────────────────────────
  # Drains `ungrounded_claims`: per claim → extract its entity (local :nothink
  # LLM) → Wikipedia page (via Tor) → find_or_create_source + link_claim_to_source
  # 'corroborates' → the claim_sources trigger recomputes confidence → the claim
  # leaves the view. General brain-health (grounds every inlet's claims, not just
  # the podcast). HTTP-invoked (loopback 8819): POST /backfill?limit=N {thread_ids?}.
  # obnet (db) + llm-net (entity LLM) + search-gw-net (Tor egress for Wikipedia via
  # tor:9050, the same boundary openbrain-research uses; D10).
  openbrain-grounding-backfiller:
    build:
      context: ../integrations/grounding-backfiller
      dockerfile: Dockerfile
    image: openbrain-grounding-backfiller:local
    container_name: openbrain-grounding-backfiller
    depends_on:
      openbrain-db:
        condition: service_healthy
    environment:
      DB_HOST: openbrain-db
      DB_PORT: "5432"
      DB_NAME: openbrain
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      CHAT_API_BASE: http://llama-cpp:8080/v1
      CHAT_API_KEY: ${OB_ENTITY_LLM_KEY:-not-needed}
      CHAT_MODEL: ${BACKFILL_CHAT_MODEL:-qwen36-27b}
      # Tor egress for Wikipedia (privacy-by-default). Set "" for direct if
      # Wikipedia-over-Tor proves unreliable on this exit set.
      FETCH_PROXY_URL: ${BACKFILL_FETCH_PROXY_URL:-socks5h://tor:9050}
      BACKFILL_BATCH: ${BACKFILL_BATCH:-20}
      BACKFILL_CONCURRENCY: ${BACKFILL_CONCURRENCY:-2}
      BACKFILL_INTERVAL_MS: ${BACKFILL_INTERVAL_MS:-0}
      PORT: "8000"
    ports:
      - "127.0.0.1:8819:8000"
    networks:
      - obnet
      - llm-net
      - search-gw-net
    restart: unless-stopped

volumes:
  openbrain-db-data:
  openbrain-wiki-data:
  # Binary assets (images, later audio) decoupled from the git vault (D-I, P0.4).
  # Written by openbrain-workbench, served read-only by openbrain-wiki-viewer.
  # NOT mounted into openbrain-wiki (the git committer), so binaries never enter
  # the vault git history.
  wiki-assets:

networks:
  # Normal bridge (user-authorized 2026-05-15): required so the host can
  # reach the published 127.0.0.1:8808/8809 ports (Claude Code on Windows
  # connects there) and so mcpo works. "No cloud" is enforced at the
  # application layer instead: there are no cloud API keys anywhere in
  # this stack and every model/DB URL points only at local containers.
  obnet:
    driver: bridge
  # The internal-only network defined by the ai-stack compose project.
  # Gives openbrain-mcp access to llama-cpp / llama-cpp-embed by name.
  llm-net:
    external: true
    name: ai-stack_llm-net
  # The ai-stack compose project's portal "app" network. External so the
  # Quartz wiki viewer can attach for BOTH the portal Caddy (external link)
  # and the tailnet `tailscale serve` path (openwebui is on app-net, and
  # the tailscale container shares openwebui's netns). It already exists
  # whenever the main stack is up — bring OB1 up after the main stack.
  app-net:
    external: true
    name: ai-stack_app-net
  # The main stack's default bridge — where the private SearXNG `gateway`
  # (search-over-Tor) is reachable by name. openbrain-research joins it to reach
  # http://gateway:8080 for search. We connect TO the privacy boundary, never
  # bypass it (the gateway still routes every query via Tor). External: exists
  # whenever the main stack is up.
  search-gw-net:
    external: true
    name: ai-stack_default
